<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
    <p class="text-lg font-semibold text-gray-900 mb-1">Créer un compte</p>
    <p class="text-sm text-gray-500 mb-6">Suivez vos réservations et cumulez des billets gratuits</p>

    <form (ngSubmit)="sInscrire()" class="space-y-3">
      <div class="flex gap-2">
        <div class="flex-1">
          <label class="text-xs text-gray-500 block mb-1">Prénom</label>
          <input [(ngModel)]="prenom" name="prenom" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" />
        </div>
        <div class="flex-1">
          <label class="text-xs text-gray-500 block mb-1">Nom</label>
          <input [(ngModel)]="nom" name="nom" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" />
        </div>
      </div>
      <div>
        <label class="text-xs text-gray-500 block mb-1">Numéro de téléphone</label>
        <input [(ngModel)]="telephone" name="telephone" type="tel" placeholder="6XX XXX XXX"
               class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="text-xs text-gray-500 block mb-1">Mot de passe</label>
        <input [(ngModel)]="password" name="password" type="password" minlength="6"
               class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" />
        <p class="text-[11px] text-gray-400 mt-1">6 caractères minimum</p>
      </div>

      <p *ngIf="erreur" class="text-sm text-red-600">{{ erreur }}</p>

      <button type="submit" [disabled]="chargement"
              class="w-full bg-(--color-primary) hover:bg-(--color-primary-dark) disabled:opacity-50 text-white font-medium rounded-lg py-2.5 transition-colors">
        {{ chargement ? 'Création...' : 'Créer mon compte' }}
      </button>
    </form>

    <p class="text-sm text-gray-500 text-center mt-4">
      Déjà un compte ? <a routerLink="/connexion" class="text-(--color-primary) font-medium">Se connecter</a>
    </p>
  </div>
</div>
