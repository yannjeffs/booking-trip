<div class="min-h-screen bg-gray-50">
  <app-header-public></app-header-public>
  <div class="max-w-md mx-auto px-4 py-8">
    <div class="bg-white rounded-2xl border border-gray-200 p-5 shadow-sm">
      <p class="text-base font-medium text-gray-900">Réserver un trajet</p>
      <p class="text-sm text-gray-500 mb-4">Trouvez votre prochain voyage</p>

      <div class="flex bg-gray-100 rounded-lg p-1 mb-4 text-sm">
        <button (click)="type = 'aller_simple'" class="flex-1 py-1.5 rounded-md font-medium transition-colors"
                [class.bg-white]="type === 'aller_simple'" [class.shadow-sm]="type === 'aller_simple'"
                [class.text-gray-400]="type !== 'aller_simple'">
          Aller simple
        </button>
        <button (click)="type = 'aller_retour'" class="flex-1 py-1.5 rounded-md font-medium transition-colors"
                [class.bg-white]="type === 'aller_retour'" [class.shadow-sm]="type === 'aller_retour'"
                [class.text-gray-400]="type !== 'aller_retour'">
          Aller-retour
        </button>
      </div>

      <form (ngSubmit)="rechercher()" class="space-y-3">
        <div class="flex items-center gap-2">
          <div class="flex-1">
            <label class="text-xs text-gray-500 block mb-1">Départ</label>
            <select [(ngModel)]="depart" name="depart" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-(--color-primary)">
              <option value="">Choisir</option>
              <option *ngFor="let d of destinations" [value]="d.ville">{{ d.ville }}</option>
            </select>
          </div>
          <i class="ti ti-arrow-right text-gray-400 mt-5"></i>
          <div class="flex-1">
            <label class="text-xs text-gray-500 block mb-1">Arrivée</label>
            <select [(ngModel)]="arrivee" name="arrivee" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-(--color-primary)">
              <option value="">Choisir</option>
              <option *ngFor="let d of destinations" [value]="d.ville">{{ d.ville }}</option>
            </select>
          </div>
        </div>

        <div class="flex gap-2">
          <div class="flex-1">
            <label class="text-xs text-gray-500 block mb-1">Date {{ type === 'aller_retour' ? 'aller' : '' }}</label>
            <input type="date" [(ngModel)]="date" name="date" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-(--color-primary)" />
          </div>
          <div class="flex-1" *ngIf="type === 'aller_retour'">
            <label class="text-xs text-gray-500 block mb-1">Date retour</label>
            <input type="date" [(ngModel)]="dateRetour" name="dateRetour" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-(--color-primary)" />
          </div>
        </div>

        <button type="submit" class="w-full bg-(--color-primary) hover:bg-(--color-primary-dark) text-white font-medium rounded-lg py-2.5 transition-colors">
          <i class="ti ti-search mr-1"></i> Rechercher
        </button>
      </form>
    </div>

    <div class="mt-6" *ngIf="rechercheEffectuee">
      <p class="text-sm text-gray-500" *ngIf="chargement">Recherche en cours...</p>

      <ng-container *ngIf="!chargement">
        <p class="text-sm font-medium text-gray-700 mb-2">Trajet aller</p>
        <div class="space-y-3 mb-6">
          <button *ngFor="let voyage of resultatsAller" (click)="choisirAller(voyage)"
                  class="w-full text-left bg-white rounded-2xl border p-4 shadow-sm transition-colors"
                  [class.border-gray-200]="voyageAllerChoisi?.id !== voyage.id"
                  [style.borderColor]="voyageAllerChoisi?.id === voyage.id ? 'var(--color-primary)' : null">
            <div class="flex justify-between items-center mb-2">
              <span class="text-sm font-medium">{{ voyage.trajet.depart.ville }} → {{ voyage.trajet.arrivee.ville }}</span>
              <span class="text-xs text-gray-500">{{ voyage.places_disponibles }} places</span>
            </div>
            <p class="text-xs text-gray-500">{{ voyage.date_heure_depart | date:'dd/MM/yyyy HH:mm' }} · {{ voyage.classe.nom }}</p>
            <p class="text-sm font-medium mt-1">{{ voyage.tarif.prix_adulte }} FCFA</p>
          </button>
          <p *ngIf="resultatsAller.length === 0" class="text-sm text-gray-400 text-center py-4">Aucun voyage trouvé.</p>
        </div>

        <ng-container *ngIf="type === 'aller_retour'">
          <p class="text-sm font-medium text-gray-700 mb-2">Trajet retour</p>
          <div class="space-y-3">
            <button *ngFor="let voyage of resultatsRetour" (click)="choisirRetour(voyage)"
                    class="w-full text-left bg-white rounded-2xl border p-4 shadow-sm transition-colors"
                    [class.border-gray-200]="voyageRetourChoisi?.id !== voyage.id"
                    [style.borderColor]="voyageRetourChoisi?.id === voyage.id ? 'var(--color-primary)' : null">
              <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium">{{ voyage.trajet.depart.ville }} → {{ voyage.trajet.arrivee.ville }}</span>
                <span class="text-xs text-gray-500">{{ voyage.places_disponibles }} places</span>
              </div>
              <p class="text-xs text-gray-500">{{ voyage.date_heure_depart | date:'dd/MM/yyyy HH:mm' }} · {{ voyage.classe.nom }}</p>
              <p class="text-sm font-medium mt-1">{{ voyage.tarif.prix_adulte }} FCFA</p>
            </button>
            <p *ngIf="resultatsRetour.length === 0" class="text-sm text-gray-400 text-center py-4">Aucun voyage trouvé.</p>
          </div>
        </ng-container>
      </ng-container>
    </div>
  </div>
</div>
