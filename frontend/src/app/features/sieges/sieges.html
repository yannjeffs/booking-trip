<div class="bg-white rounded-2xl border border-gray-200 p-5 shadow-sm">
  <p class="text-base font-medium text-gray-900">Sièges — aller</p>

  <div class="flex gap-4 text-xs text-gray-500 mb-4 mt-2">
    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm border border-gray-300 bg-white inline-block"></span> Libre</span>
    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm inline-block" style="background: var(--color-primary)"></span> Sélectionné</span>
    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-gray-400 inline-block"></span> Occupé</span>
  </div>

  <div class="flex justify-end mb-2 text-xs text-gray-400">→ Avant du bus</div>

  <p *ngIf="chargement" class="text-sm text-gray-400">Chargement des sièges...</p>
  <p *ngIf="erreur" class="text-sm text-red-600">{{ erreur }}</p>

  <div *ngIf="!chargement && !erreur" class="flex gap-1.5 overflow-x-auto pb-2">
    <div *ngFor="let colonne of colonnesAller" class="flex flex-col items-center">
      <div class="flex flex-col gap-1" [class.gap-3]="!colonne.banquette">
        <button
          *ngFor="let siege of colonne.sieges; let i = index"
          (click)="basculerSiegeAller(siege)"
          [disabled]="siege.statut === 'occupe'"
          class="w-8 h-8 text-[9px] rounded-md border transition-colors"
          [class.mt-3]="!colonne.banquette && i === milieu(colonne)"
          [class.bg-white]="siege.statut === 'libre' && !estSelectionne(siege.numero, 'aller')"
          [class.border-gray-300]="siege.statut === 'libre' && !estSelectionne(siege.numero, 'aller')"
          [class.bg-gray-400]="siege.statut === 'occupe'"
          [class.text-white]="siege.statut === 'occupe' || estSelectionne(siege.numero, 'aller')"
          [style.background]="estSelectionne(siege.numero, 'aller') ? 'var(--color-primary)' : null"
        >
          {{ siege.numero }}
        </button>
      </div>
      <span *ngIf="colonne.sortie_centrale" class="text-[8px] text-gray-400 mt-1 [writing-mode:vertical-lr]">Sortie</span>
    </div>
  </div>

  <div *ngIf="!chargement && !erreur && type === 'aller_retour'" class="mt-5 pt-4 border-t border-gray-100">
    <p class="text-sm font-medium text-gray-900 mb-2">Sièges — retour</p>
    <div class="flex justify-end mb-2 text-xs text-gray-400">→ Avant du bus</div>
    <div class="flex gap-1.5 overflow-x-auto pb-2">
      <div *ngFor="let colonne of colonnesRetour" class="flex flex-col items-center">
        <div class="flex flex-col gap-1" [class.gap-3]="!colonne.banquette">
          <button *ngFor="let siege of colonne.sieges; let i = index" (click)="basculerSiegeRetour(siege)"
                  [disabled]="siege.statut === 'occupe'" class="w-8 h-8 text-[9px] rounded-md border transition-colors"
                  [class.mt-3]="!colonne.banquette && i === milieu(colonne)"
                  [class.bg-white]="siege.statut === 'libre' && !estSelectionne(siege.numero, 'retour')"
                  [class.border-gray-300]="siege.statut === 'libre' && !estSelectionne(siege.numero, 'retour')"
                  [class.bg-gray-400]="siege.statut === 'occupe'"
                  [class.text-white]="siege.statut === 'occupe' || estSelectionne(siege.numero, 'retour')"
                  [style.background]="estSelectionne(siege.numero, 'retour') ? 'var(--color-primary)' : null">
            {{ siege.numero }}
          </button>
        </div>
        <span *ngIf="colonne.sortie_centrale" class="text-[8px] text-gray-400 mt-1 [writing-mode:vertical-lr]">Sortie</span>
      </div>
    </div>
  </div>

  <div *ngIf="!chargement && !erreur" class="mt-5 pt-4 border-t border-gray-100 space-y-3">
    <label class="flex items-center gap-2 text-sm text-gray-700">
      <input type="checkbox" [(ngModel)]="payerMaintenant" /> Payer maintenant
    </label>
    <label *ngIf="fidelite && creditDisponible > 0" class="flex items-center gap-2 text-sm text-gray-700">
      <input type="checkbox" [(ngModel)]="utiliserCreditFidelite" /> Utiliser mon crédit fidélité ({{ creditDisponible }})
    </label>
    <button type="button" (click)="continuer()" [disabled]="!pretAContinuer || envoiEnCours"
            class="w-full rounded-lg px-4 py-2.5 text-sm font-medium text-white disabled:opacity-50"
            style="background: var(--color-primary)">
      {{ envoiEnCours ? 'Traitement...' : 'Continuer' }}
    </button>
  </div>
</div>
