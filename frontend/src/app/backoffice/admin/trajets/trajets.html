<!-- backoffice/admin/trajets/trajets.html -->
<div class="max-w-3xl mx-auto px-6 py-8">
  <p class="text-lg font-semibold text-gray-900 mb-6">Trajets</p>
  <div class="grid grid-cols-3 gap-6">
    <div class="col-span-2 bg-white rounded-2xl border border-gray-200 overflow-hidden">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-xs text-gray-400 border-b border-gray-100 bg-gray-50"><th class="px-4 py-2 font-normal">Trajet</th><th class="px-4 py-2 font-normal">Durée</th><th class="px-4 py-2 font-normal">Distance</th><th class="px-4 py-2"></th></tr></thead>
        <tbody>
          <tr *ngFor="let t of trajets" class="border-b border-gray-50">
            <td class="px-4 py-2.5 font-medium">{{ t.depart.ville }} → {{ t.arrivee.ville }}</td>
            <td class="px-4 py-2.5 text-gray-500">{{ t.duree_estimee }}</td>
            <td class="px-4 py-2.5 text-gray-500">{{ t.distance_km ? t.distance_km + ' km' : '—' }}</td>
            <td class="px-4 py-2.5 text-right"><button (click)="supprimer(t)" class="text-gray-400 hover:text-red-600"><i class="ti ti-trash"></i></button></td>
          </tr>
          <tr *ngIf="!chargement && trajets.length === 0"><td colspan="4" class="px-4 py-6 text-center text-gray-400">Aucun trajet.</td></tr>
        </tbody>
      </table>
    </div>
    <div class="bg-white rounded-2xl border border-gray-200 p-4 h-fit">
      <p class="text-sm font-medium text-gray-900 mb-3">Ajouter un trajet</p>
      <div class="space-y-3">
        <div><label class="text-xs text-gray-500 block mb-1">Départ</label><select [(ngModel)]="formulaire.depart" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm"><option [ngValue]="null">Choisir</option><option *ngFor="let d of destinations" [ngValue]="d.id">{{ d.ville }}</option></select></div>
        <div><label class="text-xs text-gray-500 block mb-1">Arrivée</label><select [(ngModel)]="formulaire.arrivee" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm"><option [ngValue]="null">Choisir</option><option *ngFor="let d of destinations" [ngValue]="d.id">{{ d.ville }}</option></select></div>
        <div class="flex gap-2">
          <div class="flex-1"><label class="text-xs text-gray-500 block mb-1">Heures</label><input type="number" [(ngModel)]="formulaire.heures" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" /></div>
          <div class="flex-1"><label class="text-xs text-gray-500 block mb-1">Minutes</label><input type="number" [(ngModel)]="formulaire.minutes" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" /></div>
        </div>
        <div><label class="text-xs text-gray-500 block mb-1">Distance (km, optionnel)</label><input type="number" [(ngModel)]="formulaire.distance_km" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" /></div>
        <p *ngIf="erreur" class="text-xs text-red-600">{{ erreur }}</p>
        <button (click)="creer()" class="w-full bg-(--color-primary) text-white text-sm font-medium rounded-lg py-2">Ajouter</button>
      </div>
    </div>
  </div>
</div>
